# Ultralytics YOLO 🚀, AGPL-3.0 license
# RT-DETR with C2f-EfficientVIM backbone + ASF-P2 head

# Parameters
nc: 80  # number of classes
scales:
  l: [1.00, 1.00, 1024]

backbone:
  # C2f-EfficientVIM backbone
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 1, C2f_EfficientVIM, [128]]  # 2-P2/4 (160x160, 128ch)
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 1, C2f_EfficientVIM, [256]]  # 4-P3/8 (80x80, 256ch)
  - [-1, 1, Conv, [384, 3, 2]]  # 5-P4/16
  - [-1, 1, C2f_EfficientVIM, [384]]  # 6-P4/16 (40x40, 384ch)
  - [-1, 1, Conv, [384, 3, 2]]  # 7-P5/32
  - [-1, 3, C2f_EfficientVIM, [384]]  # 8-P5/32 (20x20, 384ch)

head:
  # ASF-P2 head adapted for C2f-EfficientVIM

  # 处理P5 (20x20)
  - [-1, 1, Conv, [128, 1, 1, None, 1, 1, False]]  # 9 input_proj.2 (384->128)
  - [-1, 1, AIFI_EDFFN, [1024, 8]] # 10
  - [-1, 1, Conv, [128, 1, 1]]  # 11, Y5 (20x20)

  # 处理P4 (40x40)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 12 (20x20 -> 40x40)
  - [4, 1, Conv, [128, 1, 1, None, 1, 1, False]]  # 13 P3适配 (256->128, 80x80)
  - [[13, 6, 12], 1, Zoom_cat, []] # 14  # P3(80x80), P4(40x40), Y5上采样(40x40)
  - [-1, 3, RepC3, [128, 0.5]]  # 15, fpn_blocks.0 (40x40)
  - [-1, 1, Conv, [128, 1, 1]]   # 16, Y4 (40x40)

  # 处理P3 (80x80)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 17 (40x40 -> 80x80)
  - [2, 1, Conv, [128, 1, 1, None, 1, 1, False]]  # 18 P2适配 (128->128, 160x160)
  - [[18, 4, 17], 1, Zoom_cat, []]  # 19  # P2(160x160), P3(80x80), Y4上采样(80x80)
  - [-1, 3, RepC3, [128, 0.5]]    # X3 (20), fpn_blocks.1 (80x80)

  # PAN路径
  - [-1, 1, Conv, [128, 3, 2]]   # 21, downsample_convs.0 (80x80 -> 40x40)
  - [[-1, 16], 1, Concat, [1]]  # 22 cat Y4 (40x40)
  - [-1, 3, RepC3, [128, 0.5]]    # F4 (23), pan_blocks.0 (40x40)

  - [-1, 1, Conv, [128, 3, 2]]   # 24, downsample_convs.1 (40x40 -> 20x20)
  - [[-1, 11], 1, Concat, [1]]  # 25 cat Y5 (20x20)
  - [-1, 3, RepC3, [128, 0.5]]    # F5 (26), pan_blocks.1 (20x20)

  # ScalSeq特征融合 - P3(80x80), P4(40x40), P5(20x20) -> 80x80
  - [[4, 6, 8], 1, ScalSeq, [128]] # 27
  - [[20, -1], 1, Add, []] # 28 X3(80x80) + ScalSeq(80x80) -> 80x80

  # ASF-P2上采样到P2层级 (80x80 -> 160x160)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 29 (80x80 -> 160x160)
  - [2, 1, Conv, [128, 1, 1, None, 1, 1, False]]  # 30 P2适配 (128->128, 160x160)
  - [[-1, -2], 1, Concat, [1]] # 31 (160x160 + 160x160)
  - [-1, 3, RepC3, [128, 0.5]]  # 32 (160x160)

  # 第二个ScalSeq特征融合 - P2(160x160), Add输出(80x80), F4(40x40) -> 160x160
  - [[2, 28, 23], 1, ScalSeq, [128]] # 33 ScalSeq会将P3和P4上采样到P2尺寸
  - [[32, -1], 1, Add, []] # 34 (160x160 + 160x160)

  # RTDETRDecoder: 输入尺寸应该是 P2(160x160), P3(80x80), P4(40x40), P5(20x20)
  - [[34, 28, 23, 26], 1, RTDETRDecoder, [nc, 128, 300, 4, 8, 3]]  # Detect(P2, P3, P4, P5)